# Top-level configuration for your Next.js application on Cloudflare Workers.
# Workers Builds: use 'npx opennextjs-cloudflare build' as the Build command.
# Use 'npx opennextjs-cloudflare deploy' as the Deploy command so it includes social images.

name = "webdevamin" # Default to production name
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ADMIN_URL = "https://webdevamin.app"
